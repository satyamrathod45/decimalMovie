<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Soft Gradient for Blossom Petals -->
    <radialGradient id="cherryPetalGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#fff0f3" />
      <stop offset="55%" stop-color="#fcaebc" />
      <stop offset="85%" stop-color="#e87a90" />
      <stop offset="100%" stop-color="#d05a74" />
    </radialGradient>

    <!-- Dark Branch Gradient -->
    <linearGradient id="darkBranchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211211" />
      <stop offset="50%" stop-color="#140909" />
      <stop offset="100%" stop-color="#090404" />
    </linearGradient>

    <!-- Individual Petal Base Shape -->
    <path id="singlePetal" d="M 0,0 C -15,-20 -20,-38 -8,-52 C -2,-58 0,-48 0,-42 C 0,-48 2,-58 8,-52 C 20,-38 15,-20 0,0 Z" fill="url(#cherryPetalGrad)" />

    <!-- Full Single Flower Construction -->
    <g id="blossom">
      <!-- 5 Petals -->
      <use href="#singlePetal" transform="rotate(0)" />
      <use href="#singlePetal" transform="rotate(72)" />
      <use href="#singlePetal" transform="rotate(144)" />
      <use href="#singlePetal" transform="rotate(216)" />
      <use href="#singlePetal" transform="rotate(288)" />
      
      <!-- Stamen / Center Pistils -->
      <circle cx="0" cy="0" r="5" fill="#800f2f" />
      <g stroke="#9d0208" stroke-width="1.2" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-12" />
        <line x1="0" y1="0" x2="11" y2="-5" />
        <line x1="0" y1="0" x2="7" y2="10" />
        <line x1="0" y1="0" x2="-7" y2="10" />
        <line x1="0" y1="0" x2="-11" y2="-5" />
      </g>
      <!-- Yellow Anther Tips -->
      <circle cx="0" cy="-12" r="1.8" fill="#ffb703" />
      <circle cx="11" cy="-5" r="1.8" fill="#ffb703" />
      <circle cx="7" cy="10" r="1.8" fill="#ffb703" />
      <circle cx="-7" cy="10" r="1.8" fill="#ffb703" />
      <circle cx="-11" cy="-5" r="1.8" fill="#ffb703" />
    </g>

    <!-- Flower Cluster Group -->
    <g id="flowerCluster">
      <use href="#blossom" transform="translate(0, 0) scale(1.1) rotate(10)" />
      <use href="#blossom" transform="translate(-35, -25) scale(0.95) rotate(40)" />
      <use href="#blossom" transform="translate(35, -20) scale(1) rotate(-25)" />
      <use href="#blossom" transform="translate(-10, -50) scale(0.85) rotate(80)" />
      <use href="#blossom" transform="translate(20, 35) scale(0.9) rotate(190)" />
    </g>
  </defs>

  <!-- BRANCHES STRUCTURE -->
  <g id="branches">
    <!-- Top-Left Main Thick Branch entering frame -->
    <path d="M 80,-20 C 200,60 350,140 700,180 L 700,210 C 350,170 180,90 80,20 Z" fill="url(#darkBranchGrad)" opacity="0.95" />
    
    <!-- Mid Sweeping Branch -->
    <path d="M 0,220 C 200,210 400,210 650,280 C 720,300 800,320 880,310 L 880,335 C 790,345 710,325 640,305 C 390,235 190,235 0,250 Z" fill="url(#darkBranchGrad)" opacity="0.9" />
  </g>

  <!-- BLOSSOM PLACEMENT MATCHING THE COMPOSITION -->
  <g id="allBlossoms">
    <!-- Top Center Cluster -->
    <use href="#blossom" transform="translate(340, 70) scale(0.95) rotate(15)" />
    <use href="#blossom" transform="translate(415, 50) scale(0.9) rotate(-30)" />
    <use href="#blossom" transform="translate(485, 60) scale(1.1) rotate(45)" />
    <use href="#blossom" transform="translate(560, 75) scale(1) rotate(110)" />

    <!-- Upper Left Main Group -->
    <use href="#flowerCluster" transform="translate(340, 220) scale(1.05)" />
    <use href="#blossom" transform="translate(255, 230) scale(0.9) rotate(-15)" />
    <use href="#blossom" transform="translate(240, 310) scale(1.1) rotate(65)" />
    <use href="#blossom" transform="translate(305, 480) scale(1) rotate(140)" />
    <use href="#blossom" transform="translate(395, 300) scale(0.85) rotate(-50)" />
    <use href="#blossom" transform="translate(415, 220) scale(1) rotate(20)" />
    <use href="#blossom" transform="translate(480, 255) scale(0.8) rotate(85)" />

    <!-- Right Side Major Flower Mass -->
    <use href="#flowerCluster" transform="translate(710, 190) scale(1.2) rotate(-20)" />
    <use href="#flowerCluster" transform="translate(820, 180) scale(1.15) rotate(35)" />
    <use href="#flowerCluster" transform="translate(650, 560) scale(0.95) rotate(70)" />
    <use href="#flowerCluster" transform="translate(780, 540) scale(1.1) rotate(-15)" />
    <use href="#flowerCluster" transform="translate(860, 570) scale(1.05) rotate(40)" />
    
    <!-- Dense Overlapping Fillers on the Right -->
    <use href="#blossom" transform="translate(750, 270) scale(1.1) rotate(10)" />
    <use href="#blossom" transform="translate(810, 290) scale(1) rotate(-45)" />
    <use href="#blossom" transform="translate(870, 300) scale(1.2) rotate(90)" />
    <use href="#blossom" transform="translate(660, 480) scale(0.9) rotate(15)" />
    <use href="#blossom" transform="translate(730, 470) scale(1.15) rotate(-60)" />
    <use href="#blossom" transform="translate(880, 510) scale(0.95) rotate(105)" />
  </g>

  <!-- SINGLE FALLING PETAL AT BOTTOM LEFT -->
  <use href="#singlePetal" transform="translate(245, 435) scale(0.35) rotate(155)" />
</svg>
