<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradient for soft, realistic shading -->
    <linearGradient id="sakuraGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f7a8b8" />
      <stop offset="40%" stop-color="#ffb7c5" />
      <stop offset="85%" stop-color="#ffd1dc" />
      <stop offset="100%" stop-color="#fff0f5" />
    </linearGradient>

    <!-- Subtle inner highlight for depth -->
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e88299" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f7a8b8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft drop shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#8b4556" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sakura Petal Path -->
  <g filter="url(#softShadow)" transform="rotate(-15 250 250)">
    <!-- Base Petal Shape -->
    <path 
      d="M 250,420 
         C 180,380 100,280 110,180 
         C 115,130 150,80 200,70 
         C 225,65 242,78 250,88 
         C 258,78 275,65 300,70 
         C 350,80 385,130 390,180 
         C 400,280 320,380 250,420 Z" 
      fill="url(#sakuraGradient)" 
    />

    <!-- Notch Detail Overlay for realistic curve -->
    <path 
      d="M 200,70 
         C 225,65 242,78 250,88 
         C 258,78 275,65 300,70 
         C 280,85 265,92 250,90 
         C 235,92 220,85 200,70 Z" 
      fill="#fcaebe" 
      opacity="0.5"
    />

    <!-- Delicate Vein Lines -->
    <g stroke="#e57388" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
      <!-- Center Vein -->
      <path d="M 250,400 Q 250,250 250,110" />
      
      <!-- Side Veins (Left) -->
      <path d="M 250,360 Q 220,300 180,250" />
      <path d="M 250,310 Q 210,240 160,180" />
      <path d="M 250,240 Q 215,180 175,130" />

      <!-- Side Veins (Right) -->
      <path d="M 250,360 Q 280,300 320,250" />
      <path d="M 250,310 Q 290,240 340,180" />
      <path d="M 250,240 Q 285,180 325,130" />
    </g>

    <!-- Base Glow/Accent (Narrow Pink Tip at Bottom) -->
    <path 
      d="M 250,420 
         C 235,390 220,350 225,320 
         C 240,335 260,335 275,320 
         C 280,350 265,390 250,420 Z" 
      fill="#db5a75" 
      opacity="0.25"
    />
  </g>
</svg>
